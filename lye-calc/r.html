<!doctype html>
<!--
  Shared soap recipe page for Lye Calc (soapcalc-app, lib/feature/recipe_link.dart). A recipe shared by QR code is
  https://andronaft-2.github.io/app_politics_and_terms/lye-calc/r.html#<data>.

  The recipe travels after "#", which the browser never sends to the site: no server sees it and nothing is stored.
  The page decodes it here, shows it as text, copies it as text the app's "Paste recipe" reads, and opens the app
  with the same data (lyecalc://recipe/<data>). No trackers, no scripts or fonts from anywhere else.

  <data> is base64url (no padding) of JSON, version 1: n name, y lye (n NaOH, k KOH, d both), k KOH share %,
  s superfat %, w [mode c|r|p, value, water discount %], f fragrance % of oils, p total oils in grams when the oils
  are given in %, o [[oil id or index into c, grams or %]], a [[additive, % of oils, name, INCI]] (an acid, ca la vi: [code, % of oils, % acid strength]),
  q [liquid code gm cm b a co x, own name, own INCI] only when the lye liquid is not water,
  c [[name, SAP KOH, iodine, INS, [8 fatty acids]]] the sender's own oils, t [lye °C, oils °C],
  r [NaOH, KOH, water, fragrance] in grams as the sender's app worked them out.
  Labels come from the app's own texts (lib/l10n/app_*.arb); oil names from lib/feature/oil_data.dart.
-->

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function num(v) { return Number(v).toLocaleString(document.documentElement.lang, { maximumFractionDigits: 2 }); }
  function numEn(v) { return String(Math.round(Number(v) * 100) / 100); }
  function isNum(v) { return typeof v === 'number' && isFinite(v) && v >= 0; }

  $('kicker').textContent = t.title;
  // Another recipe link opened in the same tab only changes the part after "#": show that recipe.
  window.addEventListener('hashchange', function () { location.reload(); });

  var data = (/^#([A-Za-z0-9_-]+)$/.exec(location.hash) || [])[1];
  var r = null;
  if (data && data.length <= 6000) {
    try {
      var b64 = data.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var bytes = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
      r = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes));
    } catch (e) { r = null; }
  }
  var ok = r && r.v === 1 && Array.isArray(r.o) && r.o.length > 0 && r.o.every(function (o) {
    return Array.isArray(o) && o.length === 2 && isNum(o[1]) &&
      (typeof o[0] === 'string' || (typeof o[0] === 'number' && Array.isArray(r.c) && Array.isArray(r.c[o[0]])));
  });
  if (!ok) {
    $('name').textContent = t.bad;
    return;
  }

  var name = typeof r.n === 'string' && r.n ? r.n : t.untitledRecipe;
  document.title = name + ' · Lye Calc';
  $('name').textContent = name;
  $('sub').textContent = t.sub;

  var byPercent = isNum(r.p);
  function oilName(id) {
    if (typeof id === 'number') return String(r.c[id][0] || '');
    return OILS[id] || id;
  }
  function amount(v) { return byPercent ? num(v) + ' %' : num(v) + ' g'; }
  var card = $('card');
  function section(title, rows) {
    if (!rows.length) return;
    card.appendChild(el('h2', null, title));
    rows.forEach(function (row) {
      var d = el('div', 'row');
      d.appendChild(el('span', null, row[0]));
      d.appendChild(el('b', null, row[1]));
      card.appendChild(d);
    });
  }

  var lye = { n: t.lyeNaohShort, k: t.lyeKohShort, d: t.lyeDualShort }[r.y] || '';
  if (r.y === 'd' && isNum(r.k)) lye += ' (KOH ' + num(r.k) + ' %)';
  // q [liquid code, own name, own INCI]: milk, beer... in the place of water; the amounts are the same as for water.
  var q = Array.isArray(r.q) && typeof r.q[0] === 'string' ? r.q : null;
  var liquid = q && (LIQUIDS[q[0]] || (q[0] === 'x' && q[1])) ? (q[0] === 'x' ? String(q[1]) : t[LIQUIDS[q[0]]]) : null;
  var liquidEn = q && (LIQUIDS_EN[q[0]] || (q[0] === 'x' && q[1])) ? (q[0] === 'x' ? String(q[1]) : LIQUIDS_EN[q[0]]) : null;
  var w = Array.isArray(r.w) ? r.w : [];
  var water = w[0] === 'c' ? [t.waterModeConcentration, num(w[1]) + ' %']
    : w[0] === 'r' ? [t.waterModeRatio, num(w[1]) + ' : 1']
    : w[0] === 'p' ? [t.waterModePercent, num(w[1]) + ' %'] : null;
  var settings = [[t.lyeTitle, lye]];
  if (isNum(r.s)) settings.push([t.superfat, num(r.s) + ' %']);
  if (liquid) settings.push([t.liquidLabel, liquid]);
  if (water) settings.push(water);
  if (isNum(r.f) && r.f > 0) settings.push([t.fragrance, num(r.f) + ' %']);
  section(t.lyeTitle, settings);

  var oils = r.o.map(function (o) { return [oilName(o[0]), amount(o[1])]; });
  if (byPercent) oils.push(['= ' + num(r.p) + ' g', '100 %']);
  section(t.oilsTitle, oils);

  var additives = (Array.isArray(r.a) ? r.a : []).filter(function (a) { return Array.isArray(a) && isNum(a[1]); });
  function additiveName(a, en) { return a[0] === 'x' && a[2] ? String(a[2]) : (en ? ADDITIVES_EN[a[0]] : t[ADDITIVES[a[0]]]) || ''; }
  function acidStrength(a, en) { return ACIDS[a[0]] && isNum(a[2]) && a[2] > 0 && a[2] <= 100 ? (en ? ' (' + numEn(a[2]) + '% acid)' : ' · ' + t.acidStrength + ' ' + num(a[2]) + ' %') : ''; }
  section(t.additivesTitle, additives.map(function (a) { return [additiveName(a, false), num(a[1]) + ' %' + acidStrength(a, false)]; }));

  var made = Array.isArray(r.r) && r.r.length === 4 && r.r.every(isNum) ? r.r : null;
  if (made) {
    var rows = [];
    if (made[0] > 0) rows.push(['NaOH', num(made[0]) + ' g']);
    if (made[1] > 0) rows.push(['KOH', num(made[1]) + ' g']);
    rows.push([liquid || t.water, num(made[2]) + ' g']);
    if (made[3] > 0) rows.push([t.fragrance, num(made[3]) + ' g']);
    section(t.senderLye, rows);
  }

  $('safety').textContent = t.weighSafety;
  $('footer').textContent = t.pdfFooter;
  $('recipe').className = '';

  // Text the app's "Paste recipe" reads (English words, one ingredient per line), with the link that carries the
  // exact recipe at the end: pasted into Lye Calc, the link wins.
  var link = 'https://andronaft-2.github.io/app_politics_and_terms/lye-calc/r.html#' + data;
  var text = [name];
  if (isNum(r.s)) text.push('Superfat ' + numEn(r.s) + '%');
  if (isNum(r.f) && r.f > 0) text.push('Fragrance ' + numEn(r.f) + '%');
  text.push('');
  r.o.forEach(function (o) { text.push('• ' + oilName(o[0]) + ' ' + numEn(o[1]) + (byPercent ? '%' : ' g')); });
  if (byPercent) text.push('Oils total ' + numEn(r.p) + ' g');
  additives.forEach(function (a) { text.push('• ' + additiveName(a, true) + ' ' + numEn(a[1]) + '% of oils' + acidStrength(a, true)); });
  if (made) {
    text.push('');
    text.push('Lye and ' + (liquidEn || 'water') + ' (sender’s Lye Calc): ' + [
      made[0] > 0 ? 'NaOH ' + numEn(made[0]) + ' g' : null,
      made[1] > 0 ? 'KOH ' + numEn(made[1]) + ' g' : null,
      (liquidEn || 'water') + ' ' + numEn(made[2]) + ' g'
    ].filter(Boolean).join(', '));
  }
  text.push('');
  text.push('Lye Calc: ' + link);
  text = text.join('\n');

  $('copy').textContent = t.copy;
  $('copy').addEventListener('click', function () {
    function done() { $('copied').textContent = t.copied; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
    function fallback() {
      var area = el('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      try { if (document.execCommand('copy')) done(); } catch (e) {}
      document.body.removeChild(area);
    }
  });

  $('open').textContent = t.open;
  $('play').textContent = t.get + ' · Google Play';
  $('appstore').textContent = t.get + ' · App Store';
  $('after').textContent = t.after;
  var ua = navigator.userAgent;
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (android) {
    // Opens the app, or Google Play when it is not installed.
    $('open').href = 'intent://recipe/' + data + '#Intent;scheme=lyecalc;package=com.andrii.soapcalc;S.browser_fallback_url=' +
      encodeURIComponent(PLAY) + ';end';
  } else if (ios) {
    $('open').href = 'lyecalc://recipe/' + data;
    $('play').className = 'hidden';
    if (APP_STORE_ID) {
      $('appstore').href = 'https://apps.apple.com/app/id' + APP_STORE_ID;
      $('appstore').className = 'btn secondary';
    }
  } else {
    // On a computer there is no app to open: copying the text, or the store page, is the way.
    $('open').className = 'hidden';
    $('after').className = 'hidden';
  }
})();
</script>
</body>
</html>
